substitutions:
  _REGION: us-central1
  _REPOSITORY: frontimage
  _IMAGE: frontend
  _SERVICE: frontend
  _PROJECT_ID: conecta-salud-494022

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Instalar dependencias y generar dist/
  - id: build-react
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        npm install
        npm run build

  # Construir y subir imagen Docker
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e

        VERSION="$${TAG_NAME:-$${SHORT_SHA:-dev}}"
        IMAGE_BASE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"

        echo "Building $$IMAGE_BASE:$$VERSION"

        docker build \
          --tag "$$IMAGE_BASE:$$VERSION" \
          --tag "$$IMAGE_BASE:latest" \
          --file=Dockerfile \
          .

        docker push "$$IMAGE_BASE:$$VERSION"
        docker push "$$IMAGE_BASE:latest"

  # Deploy Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e

        VERSION="$${TAG_NAME:-$${SHORT_SHA:-dev}}"

        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:$$VERSION"

        gcloud run deploy ${_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 80

timeout: 1800s
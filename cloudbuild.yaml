substitutions:
  _REGION: us-central1
  _REPOSITORY: frontrepo
  _IMAGE: frontend
  _SERVICE: frontend
  _PROJECT_ID: "conecta-salud-494022"

  _VITE_API_URL: "https://TU_BACKEND.run.app"
  _VITE_FIREBASE_API_KEY: "api_key_value"
  _VITE_FIREBASE_AUTH_DOMAIN: "auth_domain_value"
  _VITE_FIREBASE_PROJECT_ID: "project_id_value"
  _VITE_FIREBASE_STORAGE_BUCKET: "storage_bucket_value"
  _VITE_FIREBASE_MESSAGING_SENDER_ID: "messaging_sender_id_value"
  _VITE_FIREBASE_APP_ID: "app_id_value"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e

        VERSION="$${TAG_NAME:-$${SHORT_SHA:-dev}}"
        IMAGE_BASE="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"

        echo "Building $$IMAGE_BASE:$$VERSION"

        docker build \
          --build-arg VITE_API_URL="${_VITE_API_URL}" \
          --build-arg VITE_FIREBASE_API_KEY="${_VITE_FIREBASE_API_KEY}" \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN="${_VITE_FIREBASE_AUTH_DOMAIN}" \
          --build-arg VITE_FIREBASE_PROJECT_ID="${_VITE_FIREBASE_PROJECT_ID}" \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET="${_VITE_FIREBASE_STORAGE_BUCKET}" \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${_VITE_FIREBASE_MESSAGING_SENDER_ID}" \
          --build-arg VITE_FIREBASE_APP_ID="${_VITE_FIREBASE_APP_ID}" \
          --tag "$$IMAGE_BASE:$$VERSION" \
          --tag "$$IMAGE_BASE:latest" \
          --file=Dockerfile \
          .

        docker push "$$IMAGE_BASE:$$VERSION"
        docker push "$$IMAGE_BASE:latest"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e

        VERSION="$${TAG_NAME:-$${SHORT_SHA:-dev}}"
        IMAGE="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:$$VERSION"

        gcloud run deploy ${_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated

timeout: 1800s